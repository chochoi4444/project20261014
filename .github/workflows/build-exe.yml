name: Build Windows exe

on:
  push:
    branches: [main, claude/keen-cray-1h4zfa]
    paths:
      - "nav-total-assets/python/**"
      - "nav-total-assets/src/app.html"
      - "nav-total-assets/tests/fixtures/**"
      - "nav-total-assets/vba/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: nav-total-assets/python
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.11.1 pytest

      - name: Test (matching, parity with web engine, synthetic end-to-end)
        run: python -m pytest -q

      - name: Build exe
        run: python build_exe.py

      - name: Smoke test - command-line exe on synthetic files
        run: |
          python tests/make_fixture.py "$env:RUNNER_TEMP\fx"
          .\dist\TotalAssetsFiller-cli.exe "$env:RUNNER_TEMP\fx\대상.xlsx" "$env:RUNNER_TEMP\fx\장부" -q
          if ($LASTEXITCODE -ne 0) { throw "cli exe failed: $LASTEXITCODE" }
          python -c "import openpyxl,sys; ws=openpyxl.load_workbook(sys.argv[1]).worksheets[0]; v=(ws['D2'].value, ws['D3'].value); print(v); assert v==(5000000000,21000000000)" "$env:RUNNER_TEMP\fx\대상_총자산입력.xlsx"

      - name: Smoke test - window exe opens
        run: |
          $p = Start-Process -FilePath .\dist\TotalAssetsFiller.exe -ArgumentList "--selftest-gui" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "gui exe failed: $($p.ExitCode)" }

      - name: Build offline HTML (works without internet, shareable as one file)
        working-directory: nav-total-assets
        run: |
          npm ci --omit=dev
          npm run build

      - name: Package
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist\TotalAssetsFiller.exe, dist\TotalAssetsFiller-cli.exe pkg\
          Copy-Item ..\dist\index.html pkg\TotalAssetsFiller-offline.html
          Copy-Item ..\vba\TotalAssets.bas pkg\TotalAssets-macro.bas
          Copy-Item ..\vba\README.md pkg\README-macro.md
          Copy-Item README_exe.txt pkg\README.txt
          Compress-Archive -Path pkg\* -DestinationPath TotalAssetsFiller-windows.zip -Force
          Get-ChildItem pkg, TotalAssetsFiller-windows.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: TotalAssetsFiller-windows
          path: nav-total-assets/python/TotalAssetsFiller-windows.zip

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 총자산 자동입력 exe (빌드 ${{ github.run_number }})
          body: |
            Windows용 총자산 자동입력 프로그램입니다. `TotalAssetsFiller-windows.zip`을 내려받아 압축을 풀고 `TotalAssetsFiller.exe`를 더블클릭하세요. 사용법은 zip 안의 README.txt에 있습니다.
            `TotalAssetsFiller-offline.html`은 같은 기능의 웹 화면 한 파일입니다. 인터넷 없이 크롬·엣지로 열어 쓸 수 있습니다.
            `TotalAssets-macro.bas`는 엑셀 매크로판입니다. 파일을 가져갈 수 없는 곳에서는 이 텍스트를 엑셀 VBA 모듈에 붙여 넣어 씁니다 (README-macro.md).

            - 커밋: ${{ github.sha }} (브랜치 `${{ github.ref_name }}`)
            - 빌드 중 확인: 매칭 테스트, 웹 버전과 점수 대조, 가상 장부로 exe 실행·결과 값 검증, 창 화면 실행
            - 서명되지 않은 실행 파일이라 처음 실행 때 SmartScreen 경고가 뜰 수 있습니다.
          files: nav-total-assets/python/TotalAssetsFiller-windows.zip
